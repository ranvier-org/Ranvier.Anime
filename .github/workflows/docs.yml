name: Docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the source code
      - uses: actions/checkout@v7
      # Setup dotnet, please use a global.json to ensure the right SDK is used!
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The library multi-targets net10.0, and the runner's preinstalled SDK is older, so
          # without this the build fails before any test runs.
          dotnet-version: '10.0.x'
      # Builds the site.
      - name: Generate the documentation
        run: dotnet fsi build.fsx -- docs
      # A failure leaves the documentation deployable, without the proofs.
      - name: Add the proofs site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id="$(gh run list --workflow proofs-site.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          name=""
          if [ -n "$run_id" ]; then
            name="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --jq '[.artifacts[].name | select(startswith("proofs-site"))][0] // empty')"
          fi
          if [ -z "$name" ] || ! gh run download "$run_id" --name "$name" --dir docs/output/proofs; then
            echo "::warning::This deployment has no proofs site: no Proofs site artifact from main was available."
          fi
      # Upload the static files
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/output

  # GitHub Actions recommends deploying in a separate job.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
